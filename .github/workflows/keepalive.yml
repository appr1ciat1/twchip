name: keepalive

# GitHub 會在「公開 repo 連續 60 天沒有任何活動」時自動停用排程。
# 資料都寫到 Hugging Face，repo 本身不會有 commit，所以每月寫一個小檔案保持活動。
on:
  schedule:
    - cron: "23 4 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%FT%TZ > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "chore: keepalive $(date -u +%F)" && git push
