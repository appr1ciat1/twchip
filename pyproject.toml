[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twchip"
version = "0.1.0"
description = "台股籌碼資料庫：三大法人、外資持股、個股日成交、券商分點。先驗證，後發布。"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "pandas>=2.2",
  "pyarrow>=15",
  "duckdb>=1.0",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "huggingface_hub>=0.24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "playwright>=1.40", "pyyaml>=6"]

[project.scripts]
twchip = "twchip.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
twchip = ["site_template/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
